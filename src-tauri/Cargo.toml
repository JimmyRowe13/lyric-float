[package]
name = "lyric-float"
version = "0.2.0"
description = "Desktop lyrics overlay for Apple Music web and any Windows media session"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "lyric_float_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# blocking client keeps the poller thread simple; no async runtime needed yet
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    # Schannel instead of rustls: rustls broke the chunked body stream against
    # lrclib.net on the development machine (200 OK, then "error decoding body").
    "native-tls",
    "gzip",
    "brotli",
    "deflate",
] }
quick-xml = "0.36"
urlencoding = "2"
# Localhost WebSocket only (ws://, no TLS), used to talk to Chrome DevTools.
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "ApplicationModel",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
