<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>lyric-float M0 local player</title>
</head>

<body style="background:#111;color:#eee;font:14px monospace;padding:20px">
  <div id="st">starting…</div>
  <audio id="a" src="tone.wav" loop></audio>
  <script>
    const a = document.getElementById('a');
    const st = document.getElementById('st');

    // Mimic what a real web player (Apple Music web included) does:
    // publish media session metadata + position state.
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'M0 Probe Tone',
      artist: 'lyric-float',
      album: 'probe'
    });

    setInterval(() => {
      try {
        navigator.mediaSession.setPositionState({
          duration: a.duration || 15,
          playbackRate: a.playbackRate,
          position: Math.min(a.currentTime, (a.duration || 15) - 0.001)
        });
      } catch (e) { }
      st.textContent = a.currentTime.toFixed(2) + ' / ' + (a.duration || 0).toFixed(2) + '  paused=' + a.paused;
    }, 250);

    a.play().then(() => { st.textContent = 'playing'; })
      .catch(e => { st.textContent = 'autoplay blocked: ' + e; });
  </script>
</body>

</html>
